# yaml-language-server: $schema=https://raw.githubusercontent.com/lolay/triage/main/schema/triage.schema.json
# triage.yaml — host checks for agent-images. `make doctor` runs the default
# (run host) profile; `make doctor MODE=build` runs the build profile. Both are
# read-only. See https://github.com/lolay/triage for the format.
#
# Profiles:
#   host    — shared by both roles
#   default — run host: runs the orchestrator and runner VMs (make runner-*)
#   build   — build host: builds the image (make build) and runs make ci
#   linux   — Linux host: builds and runs the Linux runner image (make doctor
#             on Linux)
#
# The Makefile passes --var image_ref=$(IMAGE_REF).
#
# Hints are printed under "To fix, run:", so each is a command to paste; an unquoted
# " # …" is a YAML comment and isn't shown. Naming a
# formula (brew install openai/tools/tart) trusts that formula only; Tart's
# softnet dependency comes from the same tap, so the tap itself must be trusted.

version: 1

vars:
  image_ref: agent-macos

host:
  - group: Host
    items:
      - command: uname -m
        label: Apple Silicon
        contains: arm64
        platform: macos
        hint: "# Tart runs macOS VMs on Apple Silicon only; use an M-series Mac"
      - tool: make
        hint: xcode-select --install   # Command Line Tools
      - tool: tart
        version: ">=2.38"
        hint: brew tap openai/tools && brew trust openai/tools && brew install openai/tools/tart
      # 2.39 fixes `tart list`/`tart get` failing while a VM with an ASIF disk runs
      # (openai/tart#1344); make vm-list hits it, the runner scripts don't.
      - command: tart --version
        label: tart 2.39 or later (make vm-list works while runners run)
        matches: '^(2\.(39|[4-9][0-9])|[3-9]\.)'
        severity: warn
        hint: "brew upgrade openai/tools/tart   # the tap can lag Tart's GitHub releases"
      - tool: security
        hint: "# built into macOS (/usr/bin/security)"
      - path: .env
        hint: make init   # creates .env from .env.example

default:
  extends: [host]
  add:
    - group: Runners
      items:
        - tool: claude
          hint: brew install --cask claude-code@latest
        # Each brew upgrade quarantines the new claude, and Gatekeeper's "downloaded
        # from the Internet" prompt blocks a launch nobody is at the screen for. The
        # orchestrator clears it when it starts; this catches it for runs by hand.
        - command: sh -c '! xattr -p com.apple.quarantine "$(realpath "$(command -v claude)")" >/dev/null 2>&1'
          label: claude not quarantined (no Gatekeeper prompt at launch)
          severity: warn
          hint: xattr -d com.apple.quarantine "$(realpath "$(command -v claude)")"
        - path: vms/runner.env
          hint: cp vms/example-claude.env vms/runner.env
        # Reading the value (-w, sent to /dev/null) is what the scripts do, and only
        # it tells the two failures apart by exit status: 44 is a missing item, 36 a
        # login keychain locked in this session, as it stays over SSH. A locked
        # keychain passes the first check, since it can't say whether the item exists.
        - command: sh -c 'security find-generic-password -s agent-images.claude-environment-secret -w >/dev/null 2>&1; [ $? -ne 44 ]'
          label: Claude environment secret in the Keychain
          hint: make secret-set NAME=claude-environment-secret
        - command: sh -c 'security find-generic-password -s agent-images.claude-environment-secret -w >/dev/null 2>&1; [ $? -ne 36 ]'
          label: login keychain unlocked in this session (it stays locked over SSH)
          hint: security unlock-keychain ~/Library/Keychains/login.keychain-db
        - command: tart get {{ image_ref }}
          label: "image {{ image_ref }} available"
          hint: "make build   # or make image-pull when IMAGE_REF is a registry image"
    - group: Restarts
      items:
        - command: fdesetup status
          label: FileVault off (automatic login possible)
          contains: FileVault is Off
          severity: info
          hint: "# either is fine; README \"Run\" covers the two restart options"

build:
  extends: [host]
  add:
    - group: Image build
      items:
        - tool: packer
          version: ">=1.16.1"
          hint: brew install hashicorp/tap/packer
        - command: packer plugins installed
          label: Packer Tart plugin
          contains: tart
          hint: make init   # runs packer init, which installs the Tart plugin
        - tool: python3
          hint: xcode-select --install   # Command Line Tools include python3 (make lint checks JSON)
    - group: Lint
      items:
        - tool: shellcheck
          hint: brew install shellcheck
        - tool: shfmt
          hint: brew install shfmt
        - tool: plutil
          hint: "# built into macOS (/usr/bin/plutil)"

# The Linux host builds and runs the Linux runner image (specs/linux.md). make
# doctor on Linux runs this profile; make host-setup fixes most of it.
linux:
  - group: Host
    items:
      - command: uname -m
        label: x86_64
        contains: x86_64
        platform: linux
        hint: "# the emulator's KVM images need an Intel or AMD host"
      - command: grep -Ec '(vmx|svm)' /proc/cpuinfo
        label: VT-x or AMD-V
        platform: linux
        hint: "# turn on virtualization (VT-x or SVM mode) in the firmware settings"
      - command: sh -c 'cat /sys/module/kvm_intel/parameters/nested /sys/module/kvm_amd/parameters/nested 2>/dev/null'
        label: nested virtualization (the emulator runs inside each VM)
        contains: "Y"
        platform: linux
        hint: make host-setup
      - tool: make
        hint: sudo apt-get install -y make
      - path: .env
        hint: make init   # creates .env from .env.linux.example
  - group: LXD
    items:
      - tool: lxc
        hint: make host-setup
      - command: lxc storage list --format csv
        label: LXD storage pool on ZFS (copy-on-write clones)
        contains: zfs
        hint: make host-setup
      - command: lxc image info {{ image_ref }}
        label: "image {{ image_ref }} available"
        hint: make build
  - group: Runners
    items:
      - tool: claude
        hint: make host-setup
      - path: vms/runner.env
        hint: cp vms/example-linux.env vms/runner.env
      - command: sh -c 'test -s "$HOME/.config/agent-images/claude-environment-secret"'
        label: Claude environment secret in ~/.config/agent-images
        hint: make secret-set NAME=claude-environment-secret
      - command: sh -c 'loginctl show-user "$(id -un)" --property=Linger --value'
        label: lingering (the orchestrator starts at boot)
        contains: "yes"
        hint: make host-setup
