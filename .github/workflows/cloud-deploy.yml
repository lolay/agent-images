# Deploys the GCP runners from main (specs/gcp.md, "Image pipeline"). Only main
# deploys, enforced three ways: this workflow runs on a push to main, a
# schedule (which GitHub runs on main, the default branch) or a manual
# dispatch; the jobs that touch GCP run in the production environment, whose
# branch policy allows main only; and the workload identity provider accepts
# only this repo's id with ref refs/heads/main and environment production. A job
# without `environment: production` gets no GCP token at all, so plan has no
# id-token permission.
name: cloud-deploy

on:
  push:
    branches: [main]
  # Scheduled no-cache rebuilds, by each type's REBUILD in infra/gcp/<type>.env
  # (specs/gcp.md, "Rebuild cadence"). plan maps the cron string to the class,
  # so keep these strings in step with its case statement.
  schedule:
    # nightly: linux and the orchestrator, after the weekday's Claude releases
    - cron: "7 4 * * 2-6"
      timezone: "America/Los_Angeles"
    # weekly: gis and android, the slow, costly builds
    - cron: "37 5 * * 0"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      targets:
        description: "What to deploy: all, or types and/or orchestrator, space-separated (linux android orchestrator)"
        required: true
        default: all
      no-cache:
        description: "Build without the layer cache (picks up apt and Homebrew updates)"
        type: boolean
        default: false

permissions:
  contents: read

# Queue, never cancel: a cancelled deploy would leave its push undeployed. plan
# diffs against the last successful push deploy, so a run GitHub drops from the
# queue is covered by the next push. GitHub keeps one pending run, so a
# scheduled run can displace a waiting push run too; the next push covers it.
concurrency:
  group: cloud-deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      types: ${{ steps.targets.outputs.types }}
      has-types: ${{ steps.targets.outputs.has-types }}
      vms: ${{ steps.targets.outputs.vms }}
      has-vms: ${{ steps.targets.outputs.has-vms }}
      orchestrator: ${{ steps.targets.outputs.orchestrator }}
      prune: ${{ steps.targets.outputs.prune }}
      claude-version: ${{ steps.claude.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Targets
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.targets }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == schedule ]]; then
            case "$SCHEDULE" in
            "7 4 * * 2-6") class=nightly ;;
            "37 5 * * 0") class=weekly ;;
            *) echo "::error::no rebuild class for schedule '$SCHEDULE'"; exit 1 ;;
            esac
            echo "Scheduled $class rebuild"
            plan="$(scripts/cloud/changed-targets.sh --schedule "$class")"
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            plan="$(scripts/cloud/changed-targets.sh --all)"
            if [[ "$REQUESTED" != all ]]; then
              plan="$(jq -c --arg requested "$REQUESTED" '
                ($requested | split(" ") | map(select(. != ""))) as $names
                | {types: [.types[] | select(.type as $type | $names | index($type))],
                   vms: [.vms[] | select(.type as $type | $names | index($type))],
                   orchestrator: ($names | index("orchestrator") != null),
                   prune: false}' <<<"$plan")"
            fi
          else
            base="$(gh run list --workflow cloud-deploy.yml --branch main --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
            echo "Diffing from the last successful push deploy: ${base:-none}"
            plan="$(scripts/cloud/changed-targets.sh "$base" "$GITHUB_SHA")"
          fi
          echo "$plan" | jq .
          {
            echo "types=$(jq -c '{include: .types}' <<<"$plan")"
            echo "has-types=$(jq '.types | length > 0' <<<"$plan")"
            echo "vms=$(jq -c '{include: .vms}' <<<"$plan")"
            echo "has-vms=$(jq '.vms | length > 0' <<<"$plan")"
            echo "orchestrator=$(jq '.orchestrator' <<<"$plan")"
            echo "prune=$(jq '.prune' <<<"$plan")"
          } >>"$GITHUB_OUTPUT"
      # The orchestrator's Claude Code (it has no lock): the version is part of
      # its build, so a new release rebuilds that layer instead of the cache
      # keeping the first one. Runner types take theirs from their lock.
      - name: Claude Code version
        id: claude
        run: echo "version=$(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)" >>"$GITHUB_OUTPUT"

  types:
    needs: plan
    if: needs.plan.outputs.has-types == 'true'
    runs-on: ubuntu-24.04
    # Per type: a no-cache build, the push and the smoke, whose execution has its
    # own 30 min limit (deploy.sh). Cancelling gcloud's wait wouldn't stop the
    # execution, so that limit, not this one, is what bounds its cost (r1.f8).
    timeout-minutes: 120
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.types) }}
    name: type (${{ matrix.type }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Project settings
        run: grep -E '^[A-Z_]+=' infra/gcp/project.env >>"$GITHUB_ENV"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Registry login
        if: matrix.build
        run: gcloud auth configure-docker "${ARTIFACT_REGISTRY%%/*}" --quiet
      - name: Tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::12}" >>"$GITHUB_OUTPUT"
      # Hosted runners leave about 14 GB free, and agent-gis alone is 9 GB. The
      # preinstalled toolchains these jobs never use (.NET, Android, GHC,
      # CodeQL) are about 30 GB more.
      - name: Free disk
        if: matrix.build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: matrix.build
      # The Actions cache holds 10 GB per repo, shared by every type, and a GPU
      # type's cache would carry CUDA's 4 GB of layers, evicting linux's and
      # gis's. So -gpu types build without the cache: slower, but only when
      # something they use changed, and the CPU types' caches stay intact
      # (specs/gcp.md, "Deploy: build, smoke, promote").
      # The bake's set: the type's lock (scripts/cloud/lock.sh bake-args: the
      # base digest, apt snapshot, Claude and toolchain versions), then the
      # cache settings. base gets a scope per type: with a lock each, linux's
      # and gis's bases differ whenever their locks do, and one scope would
      # thrash between them.
      - name: Build settings
        id: cache
        if: matrix.build
        env:
          TYPE: ${{ matrix.type }}
        run: |
          set -euo pipefail
          lock="$(scripts/cloud/lock.sh bake-args "$TYPE")"
          {
            echo 'set<<EOF'
            echo "$lock"
            if [[ "$TYPE" != *-gpu ]]; then
              for target in base "$TYPE-tools" "$TYPE"; do
                scope="$target"
                [[ "$target" != base ]] || scope="base-$TYPE"
                echo "$target.cache-from=type=gha,scope=$scope"
                echo "$target.cache-to=type=gha,mode=max,scope=$scope"
              done
            fi
            echo EOF
          } >>"$GITHUB_OUTPUT"
      - name: Build and push
        id: bake
        if: matrix.build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          REGISTRY: ${{ env.ARTIFACT_REGISTRY }}
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ github.sha }}
          # The next step reads bake's metadata from an environment variable.
          # Provenance in it repeats the GitHub event (with the head commit's
          # message) once per target, and a type is three targets (base,
          # <type>-tools, <type>): over Linux's per-variable limit, so bash
          # couldn't start. The digest is all the next step needs.
          BUILDX_METADATA_PROVENANCE: disabled
        with:
          source: .
          files: images/cloud/docker-bake.hcl
          # versions-<type>, the image's versions report, keeps its local output
          # (out/versions/<type>) under push; built here, it reuses the layers.
          targets: |
            ${{ matrix.type }}
            versions-${{ matrix.type }}
          push: true
          # One image manifest, not an index with attestations: the digest is
          # what Cloud Run runs and what the job records.
          provenance: false
          sbom: false
          # A scheduled rebuild skips the cache: it still builds from the lock,
          # but picks up what the lock can't pin (Homebrew, the installers).
          no-cache: ${{ inputs.no-cache == true || github.event_name == 'schedule' }}
          set: ${{ steps.cache.outputs.set }}
      - name: Smoke and promote
        env:
          TYPE: ${{ matrix.type }}
          BUILD: ${{ matrix.build }}
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          if [[ "$BUILD" == true ]]; then
            digest="$(jq -er --arg target "$TYPE" '.[$target]["containerimage.digest"]' <<<"$METADATA")"
            image="$ARTIFACT_REGISTRY/agent-$TYPE@$digest"
          else
            image=--live
          fi
          scripts/cloud/deploy.sh type "$TYPE" "$image" "$GITHUB_SHA"
          echo "agent-$TYPE: $image" >>"$GITHUB_STEP_SUMMARY"
      # Whether or not the smoke passed: a failed one is when the report helps most.
      - name: Versions report
        id: versions
        if: ${{ !cancelled() && steps.bake.outcome == 'success' }}
        env:
          TYPE: ${{ matrix.type }}
          TAG: ${{ steps.tag.outputs.tag }}
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          digest="$(jq -er --arg target "$TYPE" '.[$target]["containerimage.digest"]' <<<"$METADATA")"
          report="out/versions/$TYPE/versions.md"
          name="versions-$TYPE-$TAG.md"
          cp "$report" "out/$name"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          # shellcheck disable=SC2016 # markdown backticks
          { printf '\nagent-%s `%s` at `%s`, `%s`:\n\n' "$TYPE" "$TAG" "$GITHUB_SHA" "$digest"
            cat "$report"; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.versions.outputs.name != '' }}
        with:
          name: ${{ steps.versions.outputs.name }}
          path: out/${{ steps.versions.outputs.name }}
          retention-days: 90
          if-no-files-found: error

  # The Compute Engine types (BACKEND=compute): Packer builds the image in GCP
  # (its build VM has nested virtualization, to boot the emulator once for its
  # snapshot), a smoke VM boots from it, and only then does it join the family
  # the hook creates VMs from. The build VM has no external IP; Packer reaches it
  # through IAP, which is why gcloud is set up.
  vm-images:
    needs: plan
    if: needs.plan.outputs.has-vms == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.vms) }}
    name: vm image (${{ matrix.type }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Project settings
        run: grep -E '^[A-Z_]+=' infra/gcp/project.env >>"$GITHUB_ENV"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # Keep in step with required_version in images/<type>/gce/plugins.pkr.hcl.
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.16.2"
      - name: Image name
        id: name
        env:
          TYPE: ${{ matrix.type }}
        # Unique per run: a same-day rebuild of a commit must not share a name
        # with the live image. Name limit is 63; this is ~50 with a 14-digit run id.
        run: echo "image=agent-$TYPE-$(date -u +%Y%m%d)-${GITHUB_SHA::12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
      - name: Build
        id: build
        env:
          TYPE: ${{ matrix.type }}
          IMAGE: ${{ steps.name.outputs.image }}
          # packer init looks plugins up through GitHub's API (see ci.yml).
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/cloud/deploy.sh vm-build "$TYPE" "$IMAGE" "$GITHUB_SHA"
      - name: Smoke and promote
        env:
          TYPE: ${{ matrix.type }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          scripts/cloud/deploy.sh vm-promote "$TYPE" "$IMAGE" "$GITHUB_SHA"
          echo "agent-$TYPE: $IMAGE" >>"$GITHUB_STEP_SUMMARY"
      # The report Packer downloaded from the build VM (deploy.sh vm-build), as
      # the types job does for its images. Whether or not the smoke passed: a
      # failed one is when the report helps most.
      - name: Versions report
        id: versions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TYPE: ${{ matrix.type }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          set -euo pipefail
          report="out/versions/$TYPE/versions.md"
          name="versions-$IMAGE.md"
          cp "$report" "out/$name"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          # shellcheck disable=SC2016 # markdown backticks
          { printf '\nagent-%s `%s` at `%s`:\n\n' "$TYPE" "$IMAGE" "$GITHUB_SHA"
            cat "$report"; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.versions.outputs.name != '' }}
        with:
          name: ${{ steps.versions.outputs.name }}
          path: out/${{ steps.versions.outputs.name }}
          retention-days: 90
          if-no-files-found: error

  # After the types and VM images, so a first deploy creates the job or image
  # before the orchestrator can spawn into it; skipped if one failed, and the
  # next push retries.
  orchestrator:
    needs: [plan, types, vm-images]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.orchestrator == 'true'
      && (needs.types.result == 'success' || needs.types.result == 'skipped')
      && (needs.vm-images.result == 'success' || needs.vm-images.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Project settings
        run: grep -E '^[A-Z_]+=' infra/gcp/project.env >>"$GITHUB_ENV"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Registry login
        run: gcloud auth configure-docker "${ARTIFACT_REGISTRY%%/*}" --quiet
      - name: Tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::12}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          REGISTRY: ${{ env.ARTIFACT_REGISTRY }}
          TAG: ${{ steps.tag.outputs.tag }}
          CLAUDE_VERSION: ${{ needs.plan.outputs.claude-version }}
          # As in the types' bake: the metadata the next step reads stays small.
          BUILDX_METADATA_PROVENANCE: disabled
        with:
          source: .
          files: images/cloud/docker-bake.hcl
          targets: orchestrator
          push: true
          provenance: false
          sbom: false
          # A scheduled rebuild skips the cache: picking up apt and Homebrew is its job.
          no-cache: ${{ inputs.no-cache == true || github.event_name == 'schedule' }}
          set: |
            orchestrator.cache-from=type=gha,scope=orchestrator
            orchestrator.cache-to=type=gha,mode=max,scope=orchestrator
      - name: Point the VM at it
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          digest="$(jq -er '.orchestrator["containerimage.digest"]' <<<"$METADATA")"
          scripts/cloud/deploy.sh orchestrator "$ARTIFACT_REGISTRY/agent-orchestrator@$digest"
          echo "agent-orchestrator: $ARTIFACT_REGISTRY/agent-orchestrator@$digest" >>"$GITHUB_STEP_SUMMARY"

  prune:
    needs: [plan, types, vm-images, orchestrator]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.prune == 'true'
      && needs.types.result != 'failure' && needs.vm-images.result != 'failure'
      && needs.orchestrator.result != 'failure'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Project settings
        run: grep -E '^[A-Z_]+=' infra/gcp/project.env >>"$GITHUB_ENV"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Delete jobs and images whose type is gone
        run: scripts/cloud/deploy.sh prune
