# Manual smoke test of the Linux image's contents on a hosted runner, which has
# KVM: runs images/linux/scripts directly on the runner (no LXD VM around them),
# including the emulator boot that saves the quickboot snapshot, then boots it
# again the way a session does. It proves everything in the image except LXD
# itself, without a Linux host, and that the scripts run green (nothing on
# stderr). Run it from the Actions tab after changing images/linux or
# images/shared; it never runs on pull requests.
name: linux-image-smoke

on:
  workflow_dispatch:
  # Temporary: workflow_dispatch needs the file on the default branch, so this
  # branch runs it on push once. Removed after the green run.
  push:
    branches: [claude/laughing-wright-catzvb]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STAGING_DIR: /tmp/agent-images
      # The hosted image's own user, with passwordless sudo: the counterpart of
      # the Ubuntu cloud image's ubuntu (and the macOS image's admin).
      GUEST_USER: runner
      STDERR_LOG: /tmp/agent-images-stderr.log
    steps:
      - uses: actions/checkout@v7.0.1
      # Hosted runners have /dev/kvm; this makes it usable by any user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      # The same layout scripts/linux/build-image.sh stages in the build VM.
      - name: Stage
        run: |
          mkdir -p "$STAGING_DIR/scripts"
          cp -R images/shared/. images/linux/files/. "$STAGING_DIR/"
          cp images/linux/packages.txt "$STAGING_DIR/"
          cp images/linux/scripts/*.sh "$STAGING_DIR/scripts/"
          : >"$STDERR_LOG"
      # Each script's stderr also goes to STDERR_LOG; the Green step fails on any.
      - name: setup-user
        run: bash "$STAGING_DIR/scripts/setup-user.sh" 2> >(tee -a "$STDERR_LOG" >&2)
      - name: install-packages
        run: bash "$STAGING_DIR/scripts/install-packages.sh" 2> >(tee -a "$STDERR_LOG" >&2)
      - name: ensure-android-sdk (boots the emulator once, saves the snapshot)
        run: bash "$STAGING_DIR/scripts/ensure-android-sdk.sh" 2> >(tee -a "$STDERR_LOG" >&2)
      - name: Boot the emulator as a session would
        run: |
          bash -lc '
            set -euo pipefail
            time (agent-emulator start && agent-emulator wait)
            adb -s emulator-5554 shell getprop ro.build.version.sdk
            adb -s emulator-5554 shell getprop ro.product.cpu.abi
            agent-emulator status
            agent-emulator stop
            claude --version
            ls ~/.claude ~/.claude/skills'
      - name: Green (no stderr from the image scripts)
        run: |
          if [ -s "$STDERR_LOG" ]; then
            echo "::error::the image scripts wrote $(wc -l <"$STDERR_LOG") stderr lines:"
            cat "$STDERR_LOG"
            exit 1
          fi
          echo "green"
      - name: Emulator log
        if: always()
        run: cat "$HOME/.local/state/agent-emulator.log" || true
