# Throwaway (m5 PR B): make cloud-lint on this branch before the pull request
# exists. Deleted before PR B opens.
name: tmp-lint
on:
  push:
    branches: [claude/m5-lock-watch]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y --no-install-recommends shellcheck shfmt
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.16.2"
      - env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go version && make cloud-lint
