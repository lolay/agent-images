# Lint and validate only. Hosted macOS runners can't run Tart VMs (no nested
# virtualization), so image builds happen on a local or self-hosted Mac.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned here, not via brew: the runner image preinstalls an older Packer
      # that `brew install` leaves in place. Keep in step with required_version.
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.16.1"
      - name: Install tools
        run: brew install shellcheck shfmt
      - name: Init
        # packer init looks the Tart plugin up through GitHub's API; anonymous
        # calls share the hosted runner's IP limit and fail with a 403 once it's
        # spent. The job's token gets the repository's own, higher limit.
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make init
      - name: Gate
        run: make ci
