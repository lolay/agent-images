# Lint and validate only. Hosted macOS runners can't run Tart VMs (no nested
# virtualization), so image builds happen on a local or self-hosted Mac.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Pinned here, not via brew: the runner image preinstalls an older Packer
      # that `brew install` leaves in place. Keep in step with required_version.
      - uses: hashicorp/setup-packer@v3.4.0
        with:
          version: "1.16.1"
      - name: Install tools
        run: brew install shellcheck shfmt
      - name: Init
        run: make init
      - name: Gate
        run: make ci
