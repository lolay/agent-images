# THROWAWAY (m5.s7, specs/handoffs/plan-m5-sextant.md): resolves each Cloud Run
# type's first lock with scripts/cloud/lock.sh on a hosted runner (Docker and
# Linux Homebrew), for committing by hand. Deleted in the commit that adds them.
name: m5-seed

on:
  pull_request:
    paths:
      - .github/workflows/m5-seed.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        type: [linux, gis, linux-gpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve ${{ matrix.type }}
        env:
          TYPE: ${{ matrix.type }}
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          mkdir -p "out/$TYPE"
          scripts/cloud/lock.sh resolve "$TYPE" >"out/$TYPE/versions.lock"
          grep -v '^apt ' "out/$TYPE/versions.lock" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "apt lines: $(grep -c '^apt ' "out/$TYPE/versions.lock")" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lock-${{ matrix.type }}
          path: out/${{ matrix.type }}/versions.lock
          retention-days: 7
          if-no-files-found: error
