# The lock watch (specs/gcp.md, "Watch" and "The lock bot"; m5). It resolves
# each runner type's lock from upstream with scripts/cloud/lock.sh and, when one
# moved, proposes the candidates as one auto-merging pull request from the bot's
# branch, lock/watch. It never deploys: the pull request merges itself once
# cloud-build's gate passes, and that push to main deploys.
#
# Separate jobs, so the App's key never shares a runner with anything resolved
# from upstream: `resolve` (read-only GITHUB_TOKEN) pulls base images, runs apt
# in them and reads Homebrew; `propose` (the lock-bot environment, main only)
# only commits the files `resolve` handed over, after checking each is a lock;
# `retry` (GITHUB_TOKEN with Actions write, no key) reruns the open pull
# request's failed build when there's nothing new to push; `unresolved` fails
# the run, after `propose`, when a type's resolve failed.
name: lock-watch

on:
  schedule:
    # The hourly run: the nightly types (D4).
    - cron: "17 8-22 * * *"
      timezone: America/Los_Angeles
    # The weekly run: every type, 50 minutes before the weekly rebuild. Keep in
    # step with WEEKLY below.
    - cron: "47 4 * * 0"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      class:
        description: The types to resolve
        type: choice
        options: [all, nightly, weekly]
        default: all

permissions:
  contents: read

# One run at a time, queued: two runs pushing lock/watch at once would race.
concurrency:
  group: lock-watch
  cancel-in-progress: false

env:
  WEEKLY: "47 4 * * 0"

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # A dispatch from another branch would resolve that branch's constraints.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      title: ${{ steps.decide.outputs.title }}
      body: ${{ steps.decide.outputs.body }}
      candidate: ${{ steps.decide.outputs.candidate }}
      failed: ${{ steps.resolve.outputs.failed }}
      pins: ${{ steps.pins.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Class
        id: class
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.class }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then class="$INPUT"
          elif [[ "$SCHEDULE" == "$WEEKLY" ]]; then class=all
          else class=nightly; fi
          echo "class=$class" | tee -a "$GITHUB_OUTPUT"
      - name: Resolve
        id: resolve
        env:
          CLASS: ${{ steps.class.outputs.class }}
        run: |
          set -euo pipefail
          # The candidate tree holds each resolved type's lock. A type that
          # fails gets none there and doesn't stop the others; the unresolved
          # job fails the run after propose.
          mkdir -p out/candidate
          scripts/cloud/lock-watch.sh resolve "$CLASS" out/candidate | tee out/results
          failed="$(sed -n 's/^failed //p' out/results | tr '\n' ' ')"
          echo "failed=${failed% }" >>"$GITHUB_OUTPUT"
      # main as it is now, not as checked out: a lock pull request can merge
      # while the types resolve, and comparing with the checkout would propose
      # its locks again (r3.f7). A resolved type whose lock main changed
      # meanwhile was resolved against the old one, so its candidate is
      # dropped (stale) rather than proposed over main's. The candidate takes
      # main's lock for each type it doesn't hold: outside the class, failed,
      # or dropped.
      - name: Main
        id: main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          scripts/cloud/lock-watch.sh stale out/results out/candidate origin/main
          scripts/cloud/lock-watch.sh seed origin/main out/main
          scripts/cloud/lock-watch.sh seed origin/main out/candidate
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$(scripts/cloud/lock-watch.sh branch)"
          open="$(scripts/cloud/lock-watch.sh open)"
          if [[ -n "$open" ]]; then
            git fetch --no-tags origin "$branch"
            # Keep the open pull request's candidates for the types this run
            # didn't resolve (the weekly run's in an hourly run, or a type whose
            # resolve failed), except a lock main changed since the branch left it.
            scripts/cloud/lock-watch.sh carry out/results out/candidate origin/main "origin/$branch"
          fi
          changed="$(scripts/cloud/lock-watch.sh changed out/main out/candidate)"
          if [[ -z "$changed" ]]; then
            action=none
            [[ -z "$open" ]] || action=close
            echo "No lock moved."
          elif [[ -n "$open" ]] && scripts/cloud/lock-watch.sh proposed out/candidate origin/main "origin/$branch"; then
            # Nothing to push, so nothing new reruns its checks: the retry job
            # reruns a failed build instead.
            action=retry
            echo "The open pull request already proposes these locks on main's head."
          else
            action=push
            printf '%s\n' "$changed" | scripts/cloud/lock-watch.sh guard
          fi
          echo "action=$action" >>"$GITHUB_OUTPUT"
          if [[ "$action" == push ]]; then
            title="$(scripts/cloud/lock-watch.sh title out/main out/candidate)"
            scripts/cloud/lock-watch.sh body out/main out/candidate >out/body.md
            # The changed locks, for the propose job: only those paths.
            candidate="$(printf '%s\n' "$changed" | tar -C out/candidate -czf - -T - | base64 -w0)"
            {
              echo "title=$title"
              echo "candidate=$candidate"
              echo "body<<LOCK_WATCH_BODY_EOF"
              cat out/body.md
              echo "LOCK_WATCH_BODY_EOF"
            } >>"$GITHUB_OUTPUT"
            { echo "## $title"; echo; cat out/body.md; echo; } >>"$GITHUB_STEP_SUMMARY"
          fi
      # Every pin with upstream's newest and its issue's state, read with
      # GITHUB_TOKEN (the App has no Issues permission), so a pin whose issue
      # closed stands out (specs/gcp.md, "Pinning a dependency"). A failed
      # lookup here mustn't fail the job, which would skip propose for every
      # type: the unresolved job reports it instead. The candidate holds every
      # type's lock only once Main has seeded it; before that, the checkout's
      # are listed, so no type's pins drop out of the list.
      - name: Pins
        id: pins
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ steps.main.outcome }}
        run: |
          set -euo pipefail
          tree=out/candidate
          [[ "$MAIN" == success ]] || tree=.
          scripts/cloud/lock-watch.sh pins "$tree" | tee -a "$GITHUB_STEP_SUMMARY"

  propose:
    needs: resolve
    if: needs.resolve.outputs.action == 'push' || needs.resolve.outputs.action == 'close'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The App's id and key are this environment's secrets, and its deployment
    # branches are main only.
    environment: lock-bot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Candidate
        if: needs.resolve.outputs.action == 'push'
        env:
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
          TITLE: ${{ needs.resolve.outputs.title }}
          BODY: ${{ needs.resolve.outputs.body }}
        run: |
          set -euo pipefail
          mkdir -p out/candidate
          base64 -d <<<"$CANDIDATE" | tar -C out/candidate -xzf - --no-same-owner --no-same-permissions
          # propose checks it holds nothing but locks before calling GitHub.
          printf '%s\n' "$TITLE" >out/title
          printf '%s\n' "$BODY" >out/body.md
      # The token is minted here rather than by a third-party action: it's
      # narrowed to this repository with Contents and Pull requests write, and
      # revoked when the job ends (scripts/cloud/lock-watch.sh token).
      - name: Token
        id: token
        env:
          LOCK_BOT_APP_ID: ${{ secrets.LOCK_BOT_APP_ID }}
          LOCK_BOT_PRIVATE_KEY: ${{ secrets.LOCK_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          token="$(scripts/cloud/lock-watch.sh token)"
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"
      - name: Propose
        if: needs.resolve.outputs.action == 'push'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          scripts/cloud/lock-watch.sh propose out/candidate "$(cat out/title)" out/body.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Close
        if: needs.resolve.outputs.action == 'close'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          scripts/cloud/lock-watch.sh close | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Revoke
        if: ${{ always() && steps.token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: scripts/cloud/lock-watch.sh revoke

  # The open pull request already proposes what upstream offers, so no push
  # reruns its checks: a build that failed on something passing (a mirror down)
  # would hold it until upstream moved again. Rerun the failed jobs, capped in
  # lock-watch.sh (retry_max), so a broken candidate isn't rebuilt every hour.
  retry:
    needs: resolve
    if: needs.resolve.outputs.action == 'retry'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/cloud/lock-watch.sh retry | tee -a "$GITHUB_STEP_SUMMARY"

  # A type whose resolve failed was left out of this run's proposal, not the
  # others' (lock-watch run 43715897836). Fail the run naming it, after propose,
  # so a broken resolve is visible without holding back the types that resolved.
  # A failed pins list is reported here too, for the same reason.
  unresolved:
    needs: [resolve, propose]
    if: ${{ always() && (needs.resolve.outputs.failed != '' || needs.resolve.outputs.pins == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail
        env:
          FAILED: ${{ needs.resolve.outputs.failed }}
          PINS: ${{ needs.resolve.outputs.pins }}
        run: |
          if [[ -n "$FAILED" ]]; then
            echo "::error title=Lock resolve failed::lock.sh resolve failed for: $FAILED. Their locks weren't proposed this run; the resolve job's log has the error. The other types were proposed as usual."
          fi
          if [[ "$PINS" == failure ]]; then
            echo "::error title=Pins list failed::An upstream lookup for a pin failed; the resolve job's Pins step has the error. The locks were proposed as usual."
          fi
          exit 1
