# Build-only check for pull requests that touch the GCP runners: lint, the unit
# tests, and a build of every cloud image (one runner each), with no push and
# no GCP credentials (specs/gcp.md, "Only main deploys"). It has no id-token
# permission and no environment, so it couldn't get a GCP token if it tried.
name: cloud-build

on:
  pull_request:
    paths:
      - images/cloud/**
      - images/android/**
      - images/shared/**
      - images/toolsets/**
      - hooks/gcp/**
      - infra/gcp/**
      - scripts/cloud/**
      - tests/unit/**
      - .dockerignore
      - Makefile
      - .github/workflows/cloud-*.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: sudo apt-get install -y --no-install-recommends shellcheck shfmt
      # The android image's Packer template is validated here; the image itself
      # builds only on main, in GCP (cloud-deploy.yml). Keep in step with
      # required_version in images/android/gce/plugins.pkr.hcl.
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.16.2"
      - name: Lint and unit tests
        # packer init looks the plugin up through GitHub's API; the job's token
        # gets the repository's own rate limit (see ci.yml).
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make cloud-lint cloud-test

  # The images to build: every Cloud Run type (the BACKEND=run files in
  # infra/gcp, as the deploy plans them) and the orchestrator, so a pull request
  # adding a type builds it (make cloud-targets, the list make cloud-ci builds).
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Targets
        id: targets
        run: |
          set -euo pipefail
          targets="$(make -s cloud-targets | jq -Rcn '[inputs]')"
          echo "$targets"
          echo "targets=$targets" >>"$GITHUB_OUTPUT"

  # One image per runner: together they don't fit on one. Each runner type is
  # loaded and smoked as the deploy smokes agent-<type>-next (specs/gcp.md, m4):
  # its binary checks and smoke tests, against local volumes for the mounts, with
  # `smoke pr` skipping the smoke tests a hosted runner can't run (a GPU's). The
  # orchestrator isn't a runner type: a build with no output is its check.
  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hosted runners leave about 44 GB free after this, and agent-gis alone is
      # 9 GB. The preinstalled toolchains these jobs never use (.NET, Android,
      # GHC, CodeQL) are about 30 GB of it.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          load=(--load)
          [[ "$TARGET" != orchestrator ]] || load=()
          CLAUDE_VERSION="$(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)" \
            docker buildx bake -f images/cloud/docker-bake.hcl "${load[@]}" "$TARGET"
          df -h /
          docker system df
      - name: Smoke ${{ matrix.target }}
        if: matrix.target != 'orchestrator'
        env:
          TARGET: ${{ matrix.target }}
        run: make cloud-smoke TYPE="$TARGET"
