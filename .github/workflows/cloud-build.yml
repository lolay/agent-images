# The pull request check for the GCP runners: lint and the unit tests, then for
# every cloud image (one runner each; a runner type from its lock) a build,
# load, `make cloud-smoke` (the toolset record, binary checks and smoke tests,
# `smoke pr`) and a versions report, with no push and no GCP credentials
# (specs/gcp.md, "Only main deploys"; m4, m5). It has no id-token permission and
# no environment, so it couldn't get a GCP token if it tried. m5's lock pull
# requests merge on it: main's ruleset requires `gate`, whose name stays the
# same as types come and go (the matrix jobs' names don't).
#
# It runs on every pull request, so `gate` always reports; `changes` decides
# whether the pull request touches anything this checks, and when it doesn't,
# the rest is skipped and `gate` passes. (A `paths` filter on the trigger would
# leave a pull request that touches only specs/ waiting forever for `gate`.)
name: cloud-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Paths
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # What this workflow checks: the paths that build, smoke or test a cloud
        # image, and the workflows that do it.
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE...$HEAD")"
          printf '%s\n' "$changed"
          relevant=false
          if grep -qE '^(images/(cloud|android|shared|toolsets)/|hooks/gcp/|infra/gcp/|scripts/cloud/|tests/unit/|\.dockerignore$|Makefile$|\.github/workflows/(cloud-[^/]*|lock-watch)\.yml$)' <<<"$changed"; then
            relevant=true
          fi
          echo "relevant=$relevant" | tee -a "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: sudo apt-get install -y --no-install-recommends shellcheck shfmt
      # The android image's Packer template is validated here; the image itself
      # builds only on main, in GCP (cloud-deploy.yml). Keep in step with
      # required_version in images/android/gce/plugins.pkr.hcl.
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.16.2"
      - name: Lint and unit tests
        # packer init looks the plugin up through GitHub's API; the job's token
        # gets the repository's own rate limit (see ci.yml).
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make cloud-lint cloud-test MODE=android

  # The images to build: every Cloud Run type (the BACKEND=run files in
  # infra/gcp, as the deploy plans them) and the orchestrator, so a pull request
  # adding a type builds it (make cloud-targets, the list make cloud-ci builds).
  plan:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Targets
        id: targets
        run: |
          set -euo pipefail
          targets="$(make -s cloud-targets | jq -Rcn '[inputs]')"
          echo "$targets"
          echo "targets=$targets" >>"$GITHUB_OUTPUT"

  # One image per runner: together they don't fit on one. Each runner type is
  # loaded and smoked as the deploy smokes agent-<type>-next (specs/gcp.md, m4):
  # its binary checks and smoke tests, against local volumes for the mounts, with
  # `smoke pr` skipping the smoke tests a hosted runner can't run (a GPU's), and
  # its versions report goes to the summary and an artifact, so the pull request
  # shows what the image would contain. The orchestrator isn't a runner type: a
  # build with no output is its check.
  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hosted runners leave about 44 GB free after this, and agent-gis alone is
      # 9 GB. The preinstalled toolchains these jobs never use (.NET, Android,
      # GHC, CodeQL) are about 30 GB of it.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A runner type builds from its lock (images/cloud/<type>/versions.lock)
      # with its versions report, as make cloud-build does locally; --load sends
      # the image to Docker for the smoke, and versions-<type> keeps its local
      # output. The orchestrator takes the latest Claude Code.
      - name: Build ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          make cloud-build TYPE="$TARGET"
          df -h /
          docker system df
      - name: Smoke ${{ matrix.target }}
        if: matrix.target != 'orchestrator'
        env:
          TARGET: ${{ matrix.target }}
        run: make cloud-smoke TYPE="$TARGET"
      - name: Versions report
        id: versions
        if: ${{ !cancelled() && matrix.target != 'orchestrator' }}
        env:
          TARGET: ${{ matrix.target }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          report="out/versions/$TARGET/versions.md"
          [[ -f "$report" ]] || { echo "::warning::no versions report for $TARGET (did the build fail?)"; exit 0; }
          name="versions-$TARGET-pr$PR-${COMMIT::12}.md"
          cp "$report" "out/$name"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          # shellcheck disable=SC2016 # markdown backticks
          { printf 'Pull request #%s at `%s`: what agent-%s would contain.\n\n' "$PR" "$COMMIT" "$TARGET"
            cat "$report"; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.versions.outputs.name != '' }}
        with:
          name: ${{ steps.versions.outputs.name }}
          path: out/${{ steps.versions.outputs.name }}
          retention-days: 90
          if-no-files-found: error

  # The one check main's ruleset requires. It passes when the pull request
  # touches nothing this workflow checks, or when `check` and every `build` leg
  # passed; anything else (a failure, a cancel, a skip after a failed `plan`)
  # fails it.
  gate:
    needs: [changes, check, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CHECK: ${{ needs.check.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES relevant=$RELEVANT check=$CHECK build=$BUILD"
          [[ "$CHANGES" == success ]] || { echo "::error::changes: $CHANGES"; exit 1; }
          [[ "$RELEVANT" == true ]] || { echo "Nothing cloud-build checks changed."; exit 0; }
          [[ "$CHECK" == success && "$BUILD" == success ]] || { echo "::error::check: $CHECK, build: $BUILD"; exit 1; }
