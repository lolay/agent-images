# THROWAWAY (m5.s4, specs/handoffs/plan-m5-sextant.md): proves on a hosted runner
# what the lock resolver will rely on. Deleted before PR A leaves draft.
name: m5-spike

on:
  pull_request:
    paths:
      - .github/workflows/m5-spike.yml

permissions:
  contents: read
  actions: read

jobs:
  digests:
    runs-on: ubuntu-24.04
    steps:
      - name: Base digests through the mirror, without a pull
        run: |
          set -euo pipefail
          {
            echo '## Digests'
            for image in mirror.gcr.io/library/ubuntu:24.04 mirror.gcr.io/nvidia/cuda:13.0.3-devel-ubuntu24.04; do
              echo "### $image"
              echo '```text'
              echo "imagetools: $(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r '.digest + " " + .mediaType')"
              echo "skopeo: $(skopeo inspect --raw "docker://$image" | sha256sum | cut -d' ' -f1) (sha256 of the raw manifest)"
              echo "registry HEAD: $(curl -fsSI -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://mirror.gcr.io/v2/${image#mirror.gcr.io/}" | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p' | tr -d '\r' || true)"
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  apt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: linux
            image: mirror.gcr.io/library/ubuntu:24.04
          - type: linux-gpu
            image: mirror.gcr.io/nvidia/cuda:13.0.3-devel-ubuntu24.04
          - type: gis
            image: mirror.gcr.io/library/ubuntu:24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Snapshot and simulate (${{ matrix.type }})
        env:
          TYPE: ${{ matrix.type }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)"
          ref="${IMAGE%%:*}@$digest"
          packages="sudo ca-certificates curl $(bash -c 'source scripts/cloud/lib.sh; for t in $(cloud_toolsets "$1"); do f=images/toolsets/$t/packages.txt; if [[ -f $f ]]; then sed -e "s/#.*//" -e "/^[[:space:]]*$/d" "$f"; fi; done' _ "$TYPE" | tr '\n' ' ')"
          echo "$packages" | wc -w
          simulate() {
            # $1: a snapshot id, or empty for today's archive.
            docker run --rm --entrypoint /bin/bash -e SNAP="$1" -e PACKAGES="$packages" "$ref" -c '
              set -euo pipefail
              { echo "--- sources"; ls /etc/apt/sources.list.d/; cat /etc/apt/sources.list.d/*.sources 2>/dev/null | grep -v "^#"; { grep -v "^#" /etc/apt/sources.list 2>/dev/null | grep . ; } || true; apt-get -v | head -1; echo "---"; } >&2
              [[ -z "$SNAP" ]] || printf "APT::Snapshot \"%s\";\n" "$SNAP" >/etc/apt/apt.conf.d/50agent-snapshot
              apt-get update >/tmp/update.log 2>&1 || { cat /tmp/update.log >&2; exit 1; }
              { echo "--- update"; grep -E "^(Get|Hit|Ign|Err|W:|E:)" /tmp/update.log | sed -E "s/ \[[0-9.]+ [kMG]?B\]//" | head -40; echo "---"; } >&2
              grep -E "^(Get|Hit|Ign|Err|W:|E:)" /tmp/update.log | sed -E "s/ \[[0-9.]+ [kMG]?B\]//" | sort -u >&2
              apt-get install --simulate --no-install-recommends $PACKAGES >/tmp/sim.txt 2>&1 || { cat /tmp/sim.txt >&2; exit 1; }
              sed -n "s/^Inst //p" /tmp/sim.txt'
          }
          simulate 20261101T000000Z >old.txt 2>old-update.txt || { echo "snapshot run failed:"; grep -v "^E: Couldn't find" old-update.txt | head -60; exit 1; }
          simulate 20261101T000000Z >old2.txt 2>/dev/null
          simulate "" >today.txt 2>today-update.txt || { echo "today run failed:"; tail -40 today-update.txt; exit 1; }
          {
            echo "## apt: $TYPE on \`$ref\`"
            echo "- packages asked for: $(echo "$packages" | wc -w); resolved: $(wc -l <old.txt) at the snapshot, $(wc -l <today.txt) today"
            echo "- snapshot simulate twice, same result: $(cmp -s old.txt old2.txt && echo yes || echo NO)"
            echo "- changed between the snapshot and today: $(diff <(cut -d' ' -f1,2 old.txt) <(cut -d' ' -f1,2 today.txt) | grep -c '^[<>]' || true) lines"
            echo '<details><summary>update sources, snapshot run</summary>'; echo; echo '```text'; cat old-update.txt; echo '```'; echo '</details>'
            echo '<details><summary>diff, snapshot vs today</summary>'; echo; echo '```diff'; diff old.txt today.txt | head -80 || true; echo '```'; echo '</details>'
            echo '<details><summary>origins of resolved packages (today)</summary>'; echo; echo '```text'; sed -E 's/^[^ ]+ \([^ ]+ ([^ ]+).*/\1/' today.txt | sort | uniq -c; echo '```'; echo '</details>'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  brew:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Homebrew closure vs linux's versions report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          export HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1 HOMEBREW_NO_AUTO_UPDATE=1
          brew --version
          brew update --quiet 2>&1 | tail -2
          brew tap lolay/tap 2>&1 | tail -1
          brew trust --tap lolay/tap 2>&1 || echo "brew trust: not available"
          tops=()
          for t in $(bash -c 'source scripts/cloud/lib.sh; cloud_toolsets linux'); do
            f="images/toolsets/$t/Brewfile"
            [[ -f "$f" ]] || continue
            mapfile -t -O "${#tops[@]}" tops < <(brew bundle list --formula --file="$f")
          done
          printf '%s\n' "${tops[@]}" | sort -u >tops.txt
          brew deps --union --full-name $(cat tops.txt) | sort -u >deps.txt
          brew deps --union --full-name --include-build $(cat tops.txt) | sort -u >deps-build.txt
          sort -u tops.txt deps.txt >closure.txt
          brew info --json=v2 --formula $(cat closure.txt) |
            jq -r '.formulae[] | "\(.full_name) \(.versions.stable)\(if .revision > 0 then "_\(.revision)" else "" end)"' | sort >resolved.txt
          run=42283134638  # m4's deploy, which built linux
          gh run download -R "$GITHUB_REPOSITORY" "$run" -p 'versions-linux-*' -D report
          report="$(find report -type f -name '*.md' | head -1)"
          awk '/^## Homebrew/{f=1; next} f && /^```text/{g=1; next} g && /^```/{exit} g' "$report" | sort >image.txt
          {
            echo "## Homebrew: linux"
            echo "- top formulae: $(wc -l <tops.txt); closure: $(wc -l <closure.txt) (with build deps: $(sort -u tops.txt deps-build.txt | wc -l)); the image's \`brew list\`: $(wc -l <image.txt) (run $run)"
            echo '<details><summary>names in the image, not the closure / in the closure, not the image</summary>'; echo; echo '```diff'
            diff <(awk '{print $1}' image.txt | sort) <(sed 's#.*/##' resolved.txt | awk '{print $1}' | sort) || true
            echo '```'; echo '</details>'
            echo '<details><summary>version differences (image vs resolved now)</summary>'; echo; echo '```text'
            join <(awk '{print $1, $NF}' image.txt | sort) <(sed 's#^[^ ]*/##' resolved.txt | sort) | awk '$2 != $3' || true
            echo '```'; echo '</details>'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  sources:
    runs-on: ubuntu-24.04
    steps:
      - name: Upstream versions
        run: |
          set -euo pipefail
          latest() { curl -fsSLI -o /dev/null -w '%{url_effective}' "https://github.com/$1/releases/latest" | sed 's#.*/##'; }
          {
            echo "## Upstream versions"
            echo '```text'
            echo "claude latest: $(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)"
            echo "claude stable: $(curl -fsSL https://downloads.claude.ai/claude-code-releases/stable || echo 'no stable URL')"
            echo "rust stable: $(curl -fsSL https://static.rust-lang.org/dist/channel-rust-stable.toml | awk '/^\[pkg.rust\]/{f=1} f && /^version = /{print; exit}')"
            echo "tflint: $(latest terraform-linters/tflint)"
            echo "virtualgl: $(latest VirtualGL/virtualgl)"
            echo "go-containerregistry (crane): $(latest google/go-containerregistry)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Terraform through tenv
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet tenv 2>&1 | tail -1
          { echo '```text'; echo "tenv tf list-remote --stable (last 3):"; tenv tf list-remote --stable 2>/dev/null | tail -3; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
