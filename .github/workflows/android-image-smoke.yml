# Manual smoke test of the Android image's contents on a hosted runner, which has
# KVM: runs images/android/scripts directly on the runner (no LXD VM around them),
# including the emulator boot that saves the quickboot snapshot, then boots it
# again the way a session does. It proves everything in the image except LXD
# itself, without a Linux host, and that the scripts run green (nothing on
# stderr). Run it from the Actions tab after changing images/android,
# images/toolsets or images/shared; it never runs on pull requests.
name: android-image-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STAGING_DIR: /tmp/agent-images
      # The hosted image's own user, with passwordless sudo: the counterpart of
      # the Ubuntu cloud image's ubuntu (and the macOS image's admin).
      GUEST_USER: runner
      STDERR_LOG: /tmp/agent-images-stderr.log
      # For the versions report install-packages.sh writes.
      AGENT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hosted runners have /dev/kvm; this makes it usable by any user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      # The same layout scripts/linux/build-image.sh stages in the build VM.
      - name: Stage
        run: |
          mkdir -p "$STAGING_DIR/scripts"
          cp -R images/shared/. images/android/files/. "$STAGING_DIR/"
          cp images/android/toolsets.txt "$STAGING_DIR/"
          cp -R images/toolsets "$STAGING_DIR/toolsets"
          cp images/android/scripts/*.sh "$STAGING_DIR/scripts/"
          : >"$STDERR_LOG"
      # Each script's stderr also goes to STDERR_LOG; the Green step fails on any.
      - name: setup-user
        run: bash "$STAGING_DIR/scripts/setup-user.sh" 2> >(tee -a "$STDERR_LOG" >&2)
      - name: install-packages (the android toolset boots the emulator once, saves the snapshot)
        run: bash "$STAGING_DIR/scripts/install-packages.sh" 2> >(tee -a "$STDERR_LOG" >&2)
      # A VM starts it at boot (setup-user.sh enables it); here systemd was
      # already up when it was installed.
      - name: Start the virtual display
        run: |
          sudo systemctl start agent-xvfb
          systemctl is-active agent-xvfb
      - name: Boot the emulator as a session would
        run: |
          bash -lc '
            set -euo pipefail
            time (agent-emulator start && agent-emulator wait)
            adb -s emulator-5554 shell getprop ro.build.version.sdk
            adb -s emulator-5554 shell getprop ro.product.cpu.abi
            agent-emulator status
            agent-emulator stop
            java -version 2>&1 | head -n 1
            /usr/lib/jvm/java-17-openjdk-amd64/bin/java -version 2>&1 | head -n 1
            gradle --version | grep -m1 ^Gradle
            node --version && pnpm --version
            go version && command -v gomobile gobind
            cargo --version && cargo ndk --version
            rustup target list --installed | grep android
            echo "NDK: $ANDROID_NDK_HOME" && test -x "$ANDROID_NDK_HOME/ndk-build"
            du -sh "$ANDROID_HOME" "$ANDROID_NDK_HOME" /opt/gradle
            xdpyinfo | grep -m1 dimensions
            import -window root /tmp/display.png && identify /tmp/display.png
            claude --version
            ls ~/.claude ~/.claude/skills
            ! grep -qxF "<!-- toolsets -->" ~/.claude/CLAUDE.md
            sed -n "/^## Tools/,/^## Android/p" ~/.claude/CLAUDE.md'
      # A Rust library for a phone and the emulator, through the NDK.
      - name: Build a Rust library with cargo-ndk
        run: |
          bash -lc '
            set -euo pipefail
            cd "$(mktemp -d)"
            cargo new --lib --quiet ndkcheck && cd ndkcheck
            printf "\n[lib]\ncrate-type = [\"cdylib\"]\n" >>Cargo.toml
            cargo ndk -t arm64-v8a -t x86_64 -o jniLibs build --release --quiet
            file jniLibs/*/libndkcheck.so'
      # A Go package as an Android library, through the NDK.
      - name: Build a Go library with gomobile
        run: |
          bash -lc '
            set -euo pipefail
            mkdir -p "$(mktemp -d)/gocheck" && cd "$_"
            go mod init example.com/gocheck
            printf "package gocheck\n\nfunc Hello() string { return \"hi\" }\n" >gocheck.go
            go get golang.org/x/mobile/bind
            gomobile bind -target=android/arm64,android/amd64 -androidapi 24 -o gocheck.aar .
            unzip -l gocheck.aar | grep -E "classes.jar|libgojni.so"'
      - name: Green (no stderr from the image scripts)
        run: |
          if [ -s "$STDERR_LOG" ]; then
            echo "::error::the image scripts wrote $(wc -l <"$STDERR_LOG") stderr lines:"
            cat "$STDERR_LOG"
            exit 1
          fi
          echo "green"
      - name: Emulator log
        if: always()
        run: cat "$HOME/.local/state/agent-emulator.log" || true
