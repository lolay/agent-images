# Installed as /etc/systemd/journald.conf.d/agent-images-serial.conf by the
# Packer build. A runner VM's disk goes with it, so its journal goes to the
# serial console too, which the VM sends to Cloud Logging
# (serial-port-logging-enable) and the reaper can read before deleting it.
[Journal]
ForwardToConsole=yes
TTYPath=/dev/ttyS0
MaxLevelConsole=info
