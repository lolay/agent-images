# The 3d toolset's Python environment, installed to /opt/3d (install.sh) and
# locked in uv.lock. Python is held at the newest version PyTorch, Open3D and
# gsplat all publish for (specs/image-toolsets.md, "3d-gpu: a Python pinned for
# the libraries"), not the newest CPython. To move it: edit here, run
# `uv lock --upgrade` in this directory, and the next build installs the lock.
[project]
name = "agent-3d"
version = "0"
requires-python = "==3.14.*"
dependencies = [
  # PyTorch's CUDA 13.0 build, to match the toolkit and the driver Cloud Run
  # mounts (580.x); the index below, never PyPI's CPU wheel.
  "torch==2.14.1",
  "torchvision",
  # Built from source at image build for the L4 and Blackwell (install.sh), so
  # no session compiles it. Its build needs torch, ninja and setuptools present.
  "gsplat==1.5.3",
  "ninja",
  "setuptools",
  "open3d",
  "opencv-python-headless",
  "kornia",
  "laspy[lazrs]",
  "numpy",
  "scipy",
  "pillow",
  "trimesh",
  "plyfile",
]

[tool.uv]
package = false
# Only where it runs: the Cloud Run images are Linux on x86-64.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# gsplat's setup.py imports torch; install.sh syncs everything else first.
no-build-isolation-package = ["gsplat"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
