# The GIS stack, from conda-forge (specs/image-toolsets.md, "gis"). GDAL, PDAL
# and QGIS are native libraries whose Python bindings must match them, and QGIS
# isn't in Homebrew on Linux; conda-forge builds all of it against each other.
# No versions, as everywhere else ("Track the latest", specs/design.md): each
# build resolves the newest set that fits together, Python included, and
# install.sh keeps the resolved pixi.lock in the image.
#
# install.sh copies this to /opt/gis, owned by the session user, so a session
# adds packages with `pixi add --manifest-path /opt/gis/pixi.toml <name>`.
[workspace]
name = "gis"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "*"
# libgdal is GDAL with its optional drivers; libgdal-core alone lacks many.
gdal = "*"
libgdal = "*"
pdal = "*"
python-pdal = "*"
qgis = "*"
rasterio = "*"
geopandas = "*"
pyogrio = "*"
shapely = "*"
pyproj = "*"
pystac-client = "*"
rioxarray = "*"
xarray = "*"
python-duckdb = "*"
scipy = "*"
matplotlib = "*"
requests = "*"

# Pinned on breakage (specs/gcp.md, "Pinning a dependency"), 2026-11-05:
# conda-forge's newest builds disagree. tiledb 2.30.1 (and PDAL 2.10.2's TileDB
# plugin with it) links libaws-c-s3.so.1.1, while hdf5 2.2 and aws-crt-cpp hold
# aws-c-s3 below 1.1, and PDAL 2.10.2's HDF plugins need hdf5 2.x: no set
# satisfies both, and `import pdal` printed load errors for whichever plugin lost.
# tiledb below 2.30.1 solves to builds that agree (PDAL 2.10.0, hdf5 1.14).
# Remove it when an unpinned solve passes the gis bindings check.
tiledb = "<2.30.1"
