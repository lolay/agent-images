// apt settings for the image builds and the lock's apt resolve: the base layer
// installs this as /etc/apt/apt.conf.d/40agent-build for itself and every
// toolset layer after it (the runner stage removes it), and the orchestrator
// build and scripts/cloud/lock.sh resolve_apt pass it in APT_CONFIG.
//
// A failed index download fails `apt-get update` rather than warning. apt's
// default carries on without that part of the archive: a build missing
// noble-security would install unpatched packages and still pass its smoke,
// and a resolve missing noble-updates would lock older release versions.
APT::Update::Error-Mode "any";
