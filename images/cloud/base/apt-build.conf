// apt settings for the image builds and the lock's apt resolve:
// images/cloud/base/apt-prepare.sh installs this as
// /etc/apt/apt.conf.d/40agent-build, in the base layer for itself and every
// toolset layer after it (the runner stage removes it) and in
// scripts/cloud/lock.sh resolve_apt's container; the orchestrator build passes
// it in APT_CONFIG.
//
// A failed index download fails `apt-get update` rather than warning. apt's
// default carries on without that part of the archive: a build missing
// noble-security would install unpatched packages and still pass its smoke,
// and a resolve missing noble-updates would lock older release versions.
APT::Update::Error-Mode "any";
